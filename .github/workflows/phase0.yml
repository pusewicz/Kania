name: phase0
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI runners have no real GPU: Linux renders through lavapipe and Windows may not render at all,
# so frame times here are informational. The submit_ms column (CPU only) is the comparable one.
jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - name: Swift toolchain from .swift-version
        run: |
          curl -fsSL https://download.swift.org/swiftly/darwin/swiftly.pkg -o swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --assume-yes --skip-install --quiet-shell-followup
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
          ~/.swiftly/bin/swiftly install --assume-yes
      - run: brew install ninja
      - name: CF submodule commit (cache key)
        id: cf
        shell: bash
        run: echo "commit=$(git rev-parse HEAD:Vendor/cute_framework)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: Vendor/prebuilt
          key: cf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.gitmodules', 'Scripts/build-cf.sh') }}-${{ steps.cf.outputs.commit }}
      - run: Scripts/build-cf.sh
        if: hashFiles('Vendor/prebuilt/**/libcute.a') == ''
      - run: swift build -c release
      - run: swift format lint --strict --recursive Package.swift Sources Samples Benchmarks
      - run: .build/out/Products/Release/HelloTriangle --frames 30 --screenshot hello-macos.png
      - run: Scripts/bench.rb --label ci-macos --runs 3 --frames 300 --output bench-macos.md
      - uses: actions/upload-artifact@v7
        with: { name: macos, path: "hello-macos.png\nbench-macos.md\nResults/raw/" }

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    steps:
      - name: System packages
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ninja-build ruby git curl ca-certificates xvfb libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers pkg-config \
            libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
            libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev libxinerama-dev libssl-dev
      - uses: actions/checkout@v7
        with: { submodules: true }
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: CMake >= 4.2 (CF requires it)
        run: echo "$(bash Scripts/install-cmake-linux.sh)" >> "$GITHUB_PATH"
      - name: CF submodule commit (cache key)
        id: cf
        shell: bash
        run: echo "commit=$(git rev-parse HEAD:Vendor/cute_framework)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: Vendor/prebuilt
          key: cf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.gitmodules', 'Scripts/build-cf.sh') }}-${{ steps.cf.outputs.commit }}
      - run: Scripts/build-cf.sh
        if: hashFiles('Vendor/prebuilt/**/libcute.a') == ''
      - run: swift build -c release
      - name: Hello triangle and benchmark under Xvfb (lavapipe Vulkan)
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg; mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          B="$(swift build -c release --show-bin-path)"
          xvfb-run -a -s "-screen 0 1280x960x24" "$B/HelloTriangle" --frames 30 --screenshot hello-linux.png
          xvfb-run -a -s "-screen 0 1280x960x24" Scripts/bench.rb --label ci-linux --runs 3 --frames 300 --output bench-linux.md
      - uses: actions/upload-artifact@v7
        with: { name: linux, path: "hello-linux.png\nbench-linux.md\nResults/raw/" }

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - uses: compnerd/gha-setup-swift@v0.5.0
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
      - uses: ilammy/msvc-dev-cmd@v1
      - name: CF submodule commit (cache key)
        id: cf
        shell: bash
        run: echo "commit=$(git rev-parse HEAD:Vendor/cute_framework)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: Vendor/prebuilt
          key: cf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.gitmodules', 'Scripts/build-cf.sh') }}-${{ steps.cf.outputs.commit }}
      - name: Build CF with MSVC
        if: hashFiles('Vendor/prebuilt/**/cute.lib') == ''
        shell: bash
        run: Scripts/build-cf.sh x86_64-unknown-windows-msvc
      - run: swift build -c release
      - name: Hello triangle and benchmark (no GPU on the runner; informational)
        shell: pwsh
        continue-on-error: true
        run: |
          $bin = swift build -c release --show-bin-path
          & "$bin\HelloTriangle.exe" --frames 30 --screenshot hello-windows.png
          Write-Host "HelloTriangle exit=$LASTEXITCODE"
          ruby Scripts/bench.rb --label ci-windows --runs 3 --frames 300 --output bench-windows.md
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: windows, path: "hello-windows.png\nbench-windows.md\nResults/raw/" }
