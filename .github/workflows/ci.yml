name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI runners have no real GPU: Linux renders through lavapipe and Windows has no GPU either, so
# timings here mean nothing. The benchmark runs once, briefly, as a smoke test: every variant must
# run and match the C checksum. Measure on real hardware (Benchmarks/CLAUDE.md).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - name: Swift toolchain from .swift-version
        run: |
          curl -fsSL https://download.swift.org/swiftly/darwin/swiftly.pkg -o swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --assume-yes --skip-install --quiet-shell-followup
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
          ~/.swiftly/bin/swiftly install --assume-yes
      - run: brew install ninja
      - run: cmake --preset release
      - run: cmake --build --preset release
      - run: swift format lint --strict --recursive Sources Samples Benchmarks Examples Tests
      - run: ctest --test-dir build/release --output-on-failure
      - run: build/release/bin/HelloTriangle --frames 30 --screenshot hello-macos.png
      - run: Scripts/bench.rb --label ci-macos --runs 1 --frames 60 --output bench-macos.md
      - name: Example game against this checkout
        run: |
          cmake -S Examples/MinimalGame -B build/example -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_Swift_COMPILER=swiftc -DFETCHCONTENT_SOURCE_DIR_KANIA="$GITHUB_WORKSPACE"
          cmake --build build/example
          KANIA_EXIT_AFTER_FRAMES=30 build/example/MinimalGame
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: macos, path: "hello-macos.png\nbench-macos.md\nResults/raw/ci-macos.jsonl" }

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    steps:
      - name: System packages
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ninja-build ruby git curl ca-certificates xvfb libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers pkg-config \
            libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
            libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev libxinerama-dev libssl-dev
      - uses: actions/checkout@v7
        with: { submodules: true }
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: CMake >= 4.2 (CF requires it)
        run: echo "$(bash Scripts/install-cmake-linux.sh)" >> "$GITHUB_PATH"
      - run: cmake --preset release
      - run: cmake --build --preset release
      - name: Tests, hello triangle and benchmark under Xvfb (lavapipe Vulkan)
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg; mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a -s "-screen 0 1280x960x24" sh -c \
            "ctest --test-dir build/release --output-on-failure &&
             build/release/bin/HelloTriangle --frames 30 --screenshot hello-linux.png &&
             Scripts/bench.rb --label ci-linux --runs 1 --frames 60 --output bench-linux.md"
      - name: Example game against this checkout
        run: |
          cmake -S Examples/MinimalGame -B build/example -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_SOURCE_DIR_KANIA="$GITHUB_WORKSPACE"
          cmake --build build/example
          export XDG_RUNTIME_DIR=/tmp/xdg; mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          KANIA_EXIT_AFTER_FRAMES=30 xvfb-run -a -s "-screen 0 1280x960x24" build/example/MinimalGame
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: linux, path: "hello-linux.png\nbench-linux.md\nResults/raw/ci-linux.jsonl" }

  windows:
    runs-on: windows-2025
    # Windows is not a phase 1 target yet: its CMake build fails, and its result does not fail the run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      # MSVC first: gha-setup-swift moves the whole PATH into GITHUB_PATH, which the runner puts
      # ahead of the Path a later action exports. MSVC's link.exe would then come after Git's
      # coreutils link, which swiftc runs to create static libraries.
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: compnerd/gha-setup-swift@v0.5.0
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
      - name: Which link, cl and lld-link come first (temporary)
        shell: pwsh
        run: Get-Command -All -ErrorAction SilentlyContinue link, cl, lld-link | Format-Table -AutoSize Name, Source
      - run: cmake --preset release
      - run: cmake --build --preset release
      - name: Tests (not yet expected to pass on Windows)
        continue-on-error: true
        run: ctest --test-dir build/release --output-on-failure
      - name: Hello triangle and benchmark (no GPU on the runner)
        shell: pwsh
        # CF asserts creating a texture at 10k sprites on this runner; see PHASE1.md.
        continue-on-error: true
        run: |
          build\release\bin\HelloTriangle.exe --frames 30 --screenshot hello-windows.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ruby Scripts/bench.rb --label ci-windows --runs 1 --frames 60 --output bench-windows.md
      - name: Example game against this checkout
        # Not bash: Git's bash.exe puts its /usr/bin, and its link, ahead of MSVC's.
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S Examples/MinimalGame -B build/example -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DFETCHCONTENT_SOURCE_DIR_KANIA="$env:GITHUB_WORKSPACE"
          cmake --build build/example
          $env:KANIA_EXIT_AFTER_FRAMES = 30
          build\example\MinimalGame.exe
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: windows, path: "hello-windows.png\nbench-windows.md\nResults/raw/ci-windows.jsonl" }
